name: Feature Request
description: Request a new feature or enhancement
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Please describe the feature you'd like to see implemented.
        
        Once this issue is ready to be worked on, add the `ready` label to trigger Agent 1.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like to see?
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: List the specific requirements for this feature
      placeholder: |
        - Requirement 1
        - Requirement 2
        - Requirement 3
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Does this feature depend on other issues? (Use "Depends on #123" format)
      placeholder: |
        Depends on #123
        Blocked by #456
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context or information about the feature
      placeholder: Add any additional details...
    validations:
      required: false
