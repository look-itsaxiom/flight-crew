name: Agent 1 - Address PR Feedback

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  address-feedback:
    # Only run if @copilot is mentioned and it's on a PR
    if: |
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@copilot')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@copilot')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@copilot'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Get PR number
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'pull_request_review' || context.eventName === 'pull_request_review_comment') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            }
            return prNumber;
          result-encoding: string

      - name: Acknowledge feedback
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.get-pr.outputs.result }};
            
            console.log(`Feedback with @copilot mention detected on PR #${prNumber}`);
            console.log('GitHub Copilot will handle the feedback directly through GitHub Workspace.');
            
            // Optional: Add a minimal acknowledgment comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '🤖 Agent 1: Feedback received. GitHub Copilot will address the requested changes.'
            });
