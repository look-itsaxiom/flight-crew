name: Agent 1 - Dependent Issue Assignment

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  assign-copilot:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if this is a dependent issue
        id: check-dependency
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            // Check if copilot is already assigned
            const isAssigned = issue.assignees.some(assignee => assignee.login === 'copilot');
            
            if (isAssigned) {
              console.log(`@copilot is already assigned to issue #${issue.number}`);
              return 'already-assigned';
            }
            
            // Check if this issue was labeled by a human (first issue) or by automation (dependent issue)
            // If it's labeled but not assigned, it's likely a first issue that needs manual assignment
            const body = issue.body || '';
            const hasDependencies = /(?:Depends on|Blocked by|Requires)\s+#(\d+)/i.test(body);
            
            if (!hasDependencies) {
              console.log(`Issue #${issue.number} has no dependencies - requires manual @copilot assignment`);
              return 'manual-assignment-needed';
            }
            
            return 'auto-assign';
          result-encoding: string

      - name: Assign Copilot to dependent issue
        if: steps.check-dependency.outputs.result == 'auto-assign'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            try {
              // Assign @copilot to the issue
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: ['copilot']
              });
              
              console.log(`✓ Assigned @copilot to dependent issue #${issue.number}`);
              
              // Add a comment to notify about the assignment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `�� Agent 1 has assigned @copilot to this issue. GitHub Copilot will handle the implementation and create a PR automatically.`
              });
            } catch (error) {
              console.error(`Failed to assign @copilot: ${error.message}`);
              
              // Comment with guidance
              const errorMessage = [
                '⚠️ **Failed to assign @copilot**',
                '',
                'An error occurred while trying to assign @copilot to this issue:',
                '```',
                error.message,
                '```',
                '',
                'Please manually assign @copilot to this issue by clicking Assignees and typing "copilot".'
              ].join('\n');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: errorMessage
              });
            }

      - name: Provide manual assignment instructions
        if: steps.check-dependency.outputs.result == 'manual-assignment-needed'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            const message = [
              '👋 **Ready to get started!**',
              '',
              'This issue is labeled as "ready". To have GitHub Copilot work on it:',
              '',
              '1. Click **Assignees** on the right sidebar',
              '2. Type **copilot** and select **@copilot**',
              '3. GitHub Copilot Workspace will automatically create a PR and implement the changes',
              '',
              '> **Note:** For dependent issues, @copilot will be automatically assigned when their dependencies are completed.'
            ].join('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: message
            });
