name: Agent 1 - Issue Completion

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  assign-copilot:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    
    steps:
      - name: Assign Copilot to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            // Check if copilot is already assigned
            const isAssigned = issue.assignees.some(assignee => assignee.login === 'copilot');
            
            if (!isAssigned) {
              // Assign @copilot to the issue
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: ['copilot']
              });
              
              console.log(`Assigned @copilot to issue #${issue.number}`);
              
              // Add a comment to notify about the assignment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `🤖 Agent 1 has assigned @copilot to this issue. GitHub Copilot will handle the implementation and create a PR automatically.`
              });
            } else {
              console.log(`@copilot is already assigned to issue #${issue.number}`);
            }
