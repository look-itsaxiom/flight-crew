name: Agent 1 - Issue Completion

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if PR already exists
        id: check-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:copilot/issue-${context.payload.issue.number}`
            });
            return prs.length > 0;
          result-encoding: string

      - name: Checkout repository
        if: steps.check-pr.outputs.result == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create issue branch
        if: steps.check-pr.outputs.result == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b copilot/issue-${{ github.event.issue.number }}
          git push origin copilot/issue-${{ github.event.issue.number }}

      - name: Create Pull Request with Copilot
        if: steps.check-pr.outputs.result == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            // Create PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fix: ${issue.title}`,
              head: `copilot/issue-${issue.number}`,
              base: 'main',
              body: `Closes #${issue.number}\n\n@copilot Please implement the changes described in issue #${issue.number}:\n\n${issue.body}`
            });
            
            console.log(`Created PR #${pr.number}`);
            
            // Link issue to PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🤖 Agent 1 has created PR #${pr.number} to address this issue.`
            });
