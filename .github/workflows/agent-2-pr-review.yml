name: Agent 2 - PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            return {
              pr: pr,
              files: files,
              hasChanges: files.length > 0
            };

      - name: Auto Review with Copilot
        uses: actions/github-script@v7
        with:
          script: |
            const prDetails = ${{ steps.pr-details.outputs.result }};
            const pr = context.payload.pull_request;
            
            if (!prDetails.hasChanges) {
              // Request changes if no files were modified
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'REQUEST_CHANGES',
                body: '🤖 Agent 2 Review: No changes detected in this PR. Please implement the required changes.\n\n@copilot Please implement the changes described in the linked issue.'
              });
            } else {
              // Request Copilot to review the changes
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'COMMENT',
                body: '🤖 Agent 2 Review: Changes detected. Requesting detailed code review.\n\n@copilot Please review the changes in this PR for:\n1. Code quality and correctness\n2. Alignment with the issue requirements\n3. Test coverage\n4. Documentation updates\n\nIf the changes look good, approve the PR. If changes are needed, request them with specific feedback.'
              });
            }

      - name: Check if ready to merge
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const hasApproval = reviews.some(review => review.state === 'APPROVED');
            const hasChangesRequested = reviews.some(review => review.state === 'CHANGES_REQUESTED');
            
            if (hasApproval && !hasChangesRequested) {
              console.log('PR is ready to merge - has approval and no change requests');
              core.setOutput('ready_to_merge', 'true');
            } else {
              console.log('PR is not ready to merge yet');
              core.setOutput('ready_to_merge', 'false');
            }
