name: Agent 2 - PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR details and review
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            console.log(`PR #${pr.number}: ${pr.title}`);
            console.log(`Files changed: ${files.length}`);
            
            // Simple review logic:
            // - If no files changed, ask copilot to make changes
            // - If files changed, acknowledge and let it proceed
            // Agent 2 can provide feedback by commenting and tagging @copilot if needed
            // But it's not required - if everything looks fine, it can stay silent
            
            if (files.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '🤖 Agent 2: No changes detected in this PR yet. @copilot please implement the changes.'
              });
            } else {
              // PR has changes - Agent 2 could review and provide feedback here if needed
              // For now, we'll let it proceed without comment if everything looks okay
              console.log('Changes detected - proceeding without comment');
            }

      - name: Check PR status
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            console.log(`PR #${pr.number} review completed`);
